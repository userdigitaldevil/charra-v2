[package]
name = "charra_zk"
type = "bin"
authors = [""]

# Noir 1.0.0-beta.26 carries neither hash in its stdlib; both moved out into
# standalone libraries. `sha256_compression` IS still a stdlib blackbox,
# which is what src/sha256_var.nr builds on -- so the sha256 dependency here
# is only for cross-checking, not for the hot path.
[dependencies]
sha256 = { tag = "v0.3.0", git = "https://github.com/noir-lang/sha256" }
poseidon = { tag = "v0.3.0", git = "https://github.com/noir-lang/poseidon" }
